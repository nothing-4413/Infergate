name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The base gate: build, vet, tests, race detector. This is the Linux-shaped gate
  # and needs nothing from this machine's local toolchain shim (see tools/go.cmd
  # and README section 4) -- GitHub runners have Go on PATH.
  #
  # WHAT ALREADY HAPPENED HERE (run 37361004384, commit b3280cb): build, vet and
  # `go test` passed; `go test -race` exited 1. The job log is not downloadable
  # without admin rights, and the only annotation GitHub attached was "Process
  # completed with exit code 1", which names no test.
  #
  # The first fix for that piped each test step through a `grep`, so the FAIL lines
  # landed in the step log. That did not solve the problem: the log still needs
  # admin rights. The second run's race failure therefore arrived as exactly the
  # same one-line annotation, which is what a gate that cannot be read looks like.
  #
  # What replaced it: the transcript goes to a file, scripts/ci-summarize-go-test.sh
  # keeps the failing tests and any race report, and that text goes into the job's
  # step summary, where a signed-in reader sees it without downloading anything. The
  # raw transcript is uploaded as an artifact as well.
  #
  # Two later attempts to make the same text readable WITHOUT signing in both
  # failed, and the details are recorded at the summarize steps below: step
  # summaries never reach check-runs output.summary, and a check run PATCHed by the
  # workflow is wiped when the job completes. There is no anonymous channel here.
  base:
    name: build / vet / test / race
    # `checks: write` is here for ONE reason: the last step creates a check run of
    # its own to carry this job's failure output. That is not the check run GitHub
    # creates for this job -- writing to that one returns 2xx and is wiped when the
    # job completes (run 37377940124), which is why it is not used. `contents: read`
    # is the default scope for everything else.
    permissions:
      contents: read
      checks: write
    # Pinned rather than ubuntu-latest: the label announced a migration to Ubuntu
    # 26 (runner-images#14748), and a silent distro change is not something a gate
    # should inherit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # v5 / v6 rather than v4 / v5: the v4-era actions run on Node 20, which the
      # runner already warns is deprecated.
      - uses: actions/checkout@v5

      # cache: false on purpose. This module has no dependencies (no go.sum), so
      # the only thing caching would do is emit "Dependencies file is not found"
      # on every run; the Go build cache is what actually matters and setup-go
      # handles that separately.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # The repository was not gofmt-clean when this step was added: seven files
      # under cmd/ and internal/ had misaligned struct and map literals, and
      # nothing noticed because gofmt was run by hand, per file, when someone
      # remembered. gofmt -l prints the offending files, so a red run names them
      # rather than leaving a diff to be reconstructed.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            echo "run: gofmt -w ./cmd ./internal"
            exit 1
          fi

      # -timeout 20m is well under the job timeout and well over the suite's real
      # cost; if a package ever hangs, the panic names the test instead of the job
      # dying silently.
      #
      # The old shape piped into `grep -E '...'`, which dropped everything else AND
      # made the step exit 1 without saying anything a reader could act on. Now the
      # transcript goes to a file, the next step summarizes it into the step
      # summary, and `if: always()` is what makes that summary appear on a red run
      # rather than only on a green one.
      - name: go test
        run: |
          set -o pipefail
          go test ./... -count=1 -timeout 20m 2>&1 | tee /tmp/go-test.log

      # The summarizer writes its fragment to a file rather than to the runner's
      # summary, because the same text is published twice: into $GITHUB_STEP_SUMMARY
      # below (for anyone who signs in) and into a check run (for anyone who does
      # not). Writing the summary file into a file first is what makes those two
      # copies identical instead of two filters that drift apart.
      #
      # The file itself is copied into $GITHUB_STEP_SUMMARY by the next step. This
      # step's own stdout is not a channel: it is the step log, which needs admin
      # rights.
      - name: summarize go test
        if: always()
        run: |
          bash scripts/ci-summarize-go-test.sh /tmp/go-test.log /tmp/ci-summary-test.md "go test"
          cat /tmp/ci-summary-test.md >> "$GITHUB_STEP_SUMMARY"

      # The local machine cannot run this: `-race` needs cgo and there is no gcc
      # (README section 4 / section 10). A hosted runner can, which is the whole
      # reason this step exists -- and on its first real run it did fail, so it is
      # not a formality.
      #
      # ONE PACKAGE PER INVOCATION. This was tried first as a way to get the failing
      # PACKAGE out of the step list, and that reason was wrong: the step list names
      # the step ("go test -race"), not anything a loop prints inside it, and the job
      # page an anonymous reader gets has no log body at all. What the loop does give
      # a reader who signs in is the complete picture in one run -- every rejected
      # package, instead of the one that happened to be reached first -- and it costs
      # a few seconds of per-package startup. The transcript is unchanged.
      - name: go test -race
        run: |
          set -o pipefail
          : > /tmp/go-test-race.log
          failed=0
          for pkg in $(go list ./...); do
            echo "=== $pkg (race)"
            if go test -race "$pkg" -count=1 -timeout 20m 2>&1 | tee -a /tmp/go-test-race.log; then
              echo "ok(running): $pkg"
            else
              echo "FAILED(running): $pkg"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed package(s) failed under the race detector"
            exit 1
          fi

      - name: summarize go test -race
        if: always()
        run: |
          bash scripts/ci-summarize-go-test.sh /tmp/go-test-race.log /tmp/ci-summary-race.md "go test -race"
          cat /tmp/ci-summary-race.md >> "$GITHUB_STEP_SUMMARY"

      # WHERE A RED RUN'S REASON ACTUALLY LIVES, after three attempts to put it
      # somewhere better:
      #
      #   The job log needs admin rights (403 for everyone else, verified
      #   anonymously). So does the artifact download.
      #
      #   The step summary above is the one place a reader sees the failing test
      #   names without downloading anything -- but only signed in. It does not
      #   reach check-runs output.summary, and it is not in the anonymous job page.
      #
      #   PATCHing the job's own check run does work (gh api returns 2xx, from the
      #   job and from a later job, with the token in GH_TOKEN) and is then WIPED
      #   when the job completes: a job that ran afterwards and wrote
      #   output.summary read it back as null from outside, on run 37377940124.
      #   Writing to THAT check run is the dead end.
      #
      # The last step below is the variant that is not a dead end. It CREATES a
      # check run of its own with POST /check-runs, under a name nobody else owns,
      # and that one keeps its output: run 37379724217 created a probe check run
      # whose 28-byte summary was still readable through the anonymous API after the
      # whole run had completed. So a red run's failing test names are now available
      # to anyone, with no token and no download:
      #
      #   curl -s https://api.github.com/repos/nothing-4413/Infergate/commits/<sha>/check-runs
      #
      # internal/repofmt/ci_wiring_test.go keeps the summary wiring in place and
      # keeps the wiped-channel variant from coming back.
      - name: publish the failure summary where anonymous readers can reach it
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # THE TITLE TRAVELS IN AN ENVIRONMENT VARIABLE, AND THAT IS NOT STYLE.
          # A plain YAML scalar may not contain a colon followed by a space, and
          # this title has one ("ci failure: ..."). Written inline on the `run:`
          # line -- which is how 760c303 wrote it -- the file stopped being valid
          # YAML:
          #
          #   go-yaml load error in scanner at L185.C66: mapping values are not
          #   allowed in this context
          #
          # GitHub cannot start a job from a file it cannot parse, so every push
          # from 760c303 to 03655b2 produced a run with ZERO JOBS, status failure
          # and no annotation: the workflow appeared to be red for six commits
          # while in fact nothing ran. The run's display name fell back to the
          # file path (`.github/workflows/ci.yml` instead of `ci`), which is the
          # one clue it gave. Quoting the scalar, or moving the colon out of the
          # `run:` line as here, both fix it; single quotes inside a YAML scalar
          # keep the colon without the ambiguity.
          CHECK_TITLE: 'ci failure: build / vet / test / race'
        run: bash scripts/ci-publish-failure-check.sh "$CHECK_TITLE" /tmp/ci-summary-test.md /tmp/ci-summary-race.md

      - name: Upload test transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-logs
          path: |
            /tmp/go-test.log
            /tmp/go-test-race.log
          if-no-files-found: ignore
          retention-days: 7


  # The curl gates: real binaries, real processes, real sockets, real curl.exe.
  # 1060 assertions that the Linux job above cannot run at all, because all seven
  # of them are Windows PowerShell scripts that compile the binaries themselves,
  # start a gateway plus a mock upstream, drive them over TCP and tear both down
  # in a finally block. scripts/verify-hardening.ps1 rode in the same way.
  #
  # These are the gates the repository has been claiming in its README since M0
  # while they only ever ran on the author's machine. That is exactly the kind of
  # claim CI exists to stop making.
  #
  # HOW THE LOCAL TOOLCHAIN PROBLEM DISAPPEARS HERE: the scripts do not call
  # `go` directly, they call tools\go.cmd (README section 4). That shim prefers
  # the vendored .gotoolchain when it exists -- and it never exists on a clone,
  # because it is gitignored and hundreds of MB. So on this runner the shim falls
  # through to the Go on PATH that setup-go installed, with the runner's own
  # cache. Nothing else about the scripts changes.
  #
  # Each script is its own step on purpose: a red X then points at the milestone
  # that broke, and the previous ones still show they passed. Each script assigns
  # its own ports, and each stops what it started, so running them in sequence is
  # the same thing the README's "one key acceptance" section describes. The ports
  # are all distinct across scripts; verify-hardening deliberately does not use
  # gateway+1 for its mock, because its mock outlives the sibling gateways.
  #
  # WHY continue-on-error AND A WRAPPER. The first red run of this job failed at
  # M0 in five seconds and skipped M1-M6, so the run proved one gate broken and
  # said nothing about the other six -- while the fixed bug turned out to be in
  # tools/go.cmd, which every one of them depends on. continue-on-error runs all
  # eight regardless, so one red run yields the whole picture. The wrapper
  # (scripts/lib/run-gate.ps1) is there because a failing step's only readable
  # copy of its transcript was an artifact behind authentication; piping the text
  # into the step log makes the FAIL lines visible to anyone who can see the
  # repository. It captures instead of piping so $LASTEXITCODE survives, and the
  # step still reports the gate's own exit code.
  curl-gates:
    name: curl gates (M0-M6, operator token)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # -ExecutionPolicy Bypass is required, not cosmetic: the runner's default
      # policy refuses to run these files. -NoProfile keeps a runner profile from
      # changing behaviour between images.
      - name: M0 passthrough and SSE
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m0.ps1 -Name m0
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M1 routing and failover
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m1.ps1 -Name m1
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M2 semantic cache
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m2.ps1 -Name m2
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M3 quota governance
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m3.ps1 -Name m3
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M4 tiered routing
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m4.ps1 -Name m4
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M5 observability
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m5.ps1 -Name m5
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: M6 idempotency and sessions
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-m6.ps1 -Name m6
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # Last on purpose. Every gate above drives the gateway with no credentials,
      # because the operator-token gate is off by default -- which is exactly why
      # none of them can prove it works. This one turns it on, against a real
      # process, and asks a real curl for a 401.
      - name: operator token gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\lib\run-gate.ps1 -Path .\scripts\verify-hardening.ps1 -Name hardening
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # A failed gate leaves bin\ and tmp\ behind, and those logs are the only
      # place the FAIL lines are explained. Uploaded always, because with
      # continue-on-error above this step runs whether or not something red came
      # before it, and a readable copy of each transcript is the point.
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curl-gate-logs
          path: |
            tmp/*.log
            tmp/**.log
            docs/baseline/**.json
          if-no-files-found: ignore
          retention-days: 7
