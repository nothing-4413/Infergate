# InferGate M4 configuration — tiered local/cloud routing, self-contained.
#
# Identical routing to configs/tiered.yaml, but the "cloud" tier is the in-repo
# mock upstream instead of a paid provider, so scripts/measure-m4.ps1 and
# scripts/verify-m4.ps1 can run the whole tiered story with no API key and no
# network. The local tier is REAL vLLM on the GPU -- that is the point of M4 --
# so this file is the one to use when the question is "how much of my traffic
# can the local box take, and what does that save?".
#
#   wsl -d Ubuntu24 -u root -- /opt/vllm/bin/vllm serve <model> \
#        --served-model-name local-chat --port 8000
#   go run ./cmd/mockupstream -listen :9100 -name cloud
#   go run ./cmd/infergate    -config configs/tiered-local.yaml
#
# Both tiers are catch-alls for the reason spelled out in configs/tiered.yaml:
# model eligibility is the router's first filter, so a tier that does not serve
# the requested alias is not a candidate and can never be chosen by the tier
# policy. The caller sends model "local-chat" throughout.

server:
  listen: ":8080"
  read_header_timeout: "10s"
  idle_timeout: "90s"

  # The local tier is a real GPU model: the first request pays for a cold start,
  # and a 1.5B model on a laptop GPU is roughly two orders of magnitude slower
  # than the mock. A short budget here would fail the local tier for being slow
  # and hand the request to the cloud, which is precisely the measurement M4 is
  # trying NOT to produce by accident.
  upstream_timeout: "120s"

  shutdown_timeout: "15s"
  max_body_bytes: 8388608
  max_idle_conns_per_host: 256

log:
  level: "info"
  format: "text"

routing:
  strategy: "tiered"

  tier_policy:
    # Low enough that the harness's "hard" prompts really are classified as
    # hard, high enough that a normal chat turn is not.
    local_max_prompt_tokens: 400
    local_max_completion_tokens: 256
    cloud_capabilities:
      - "tools"
      - "vision"

  weights:
    cost: 3
    latency: 1
    reliability: 2
    priority: 1

  default_capabilities:
    - "chat"

health:
  # The mock tier answers instantly and the local tier does not, so the window
  # is wide enough that a single cold start cannot trip a breaker, and
  # open_duration is short because the harness restarts nothing.
  window: "30s"
  buckets: 6
  min_requests: 5
  failure_ratio: 0.5
  open_duration: "10s"
  half_open_probes: 1
  max_failures_per_request: 2
  retry_backoff: "20ms"

upstreams:
  - name: "local-vllm"
    kind: "openai"
    base_url: "http://127.0.0.1:8000"
    api_key: ""
    tier: "local"
    models:
      - "/"
    capabilities:
      - "chat"
    priority: 1
    weight: 1

  # Stands in for the paid provider. It is a catch-all so it stays eligible for
  # the caller's alias, exactly like the real cloud backend in the sibling file.
  - name: "cloud-mock"
    kind: "openai"
    base_url: "http://127.0.0.1:9100"
    api_key: ""
    tier: "cloud"
    models:
      - "/"
    capabilities:
      - "chat"
      - "tools"
      - "vision"
    priority: 2
    weight: 1

# USD per one million tokens. These are CLOUD list prices: the local tier's own
# marginal cost is zero, so everything the gateway prices for a locally served
# response is spend the cloud did not get.
pricing:
  default:
    in: 1.0
    out: 3.0
  models:
    local-chat:
      in: 0.27
      out: 1.1
